# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX is not used by this project (see gradle/libs.versions.toml), but the flag is
# kept true so that adding an AndroidX dependency later does not silently break the build.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Keep the build reproducible and offline-friendly: no analytics, no auto-download
# of the Android SDK components that we did not explicitly request.
android.builder.sdkDownload=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
