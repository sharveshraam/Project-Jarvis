name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: prove the assistant brain builds and passes its tests with NOTHING
  # but a Kotlin compiler. No Android SDK, no Gradle, no Maven resolution.
  # This is the job that enforces the ":core has zero dependencies" rule.
  # ---------------------------------------------------------------------------
  core-offline:
    name: Core (offline, no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.0.21
          curl -fsSL -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlinc.zip -d /tmp/kotlinc-dist
          echo "/tmp/kotlinc-dist/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Run offline core test suite
        run: |
          chmod +x tools/local_core_check.sh
          ./tools/local_core_check.sh

      # Validates Android resources, manifest component classes and view-binding names
      # without needing aapt2 or android.jar. Catches a whole class of error before the
      # (much slower) Gradle job runs.
      - name: Validate Android resources and manifest
        run: python3 tools/validate_android.py --verbose

  # ---------------------------------------------------------------------------
  # Job 2: the real Android build. Assembles a debug APK, runs unit tests and
  # Android lint. The debug APK is uploaded as an artifact.
  # ---------------------------------------------------------------------------
  android:
    name: Android build + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: core-offline
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Core unit tests (Gradle)
        run: ./gradlew :core:test --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
