# =======================================================================================
# Jarvis CI.
#
# NOTE: this file lives in ci/ rather than .github/workflows/ because the GitHub App
# token used for automated development on this repository does not have the `workflows`
# permission, so pushing to .github/workflows/ is rejected by GitHub. To enable it:
#
#     mkdir -p .github/workflows && cp ci/github-actions.yml .github/workflows/ci.yml
#     git add .github && git commit -m "ci: enable GitHub Actions" && git push
#
# See ci/README.md for details.
# =======================================================================================
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: everything that can be verified WITHOUT the Android SDK.
  #
  # This is the job that enforces the project's two central architectural claims:
  #   * :core has zero dependencies and its whole behavioural suite runs with only
  #     a Kotlin compiler and a Java runtime;
  #   * :app has zero third-party dependencies and type-checks against android.jar
  #     alone.
  # It runs in ~2 minutes, long before the Gradle job, so a broken foundation fails
  # fast and cheaply.
  # ---------------------------------------------------------------------------
  offline:
    name: Offline verification (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.0.21
          curl -fsSL -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlinc.zip -d /tmp/kotlinc-dist
          echo "/tmp/kotlinc-dist/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Core behavioural suite (no Gradle, no network, no SDK)
        run: ./tools/local_core_check.sh

      - name: Validate Android resources, manifest and view ids
        run: python3 tools/validate_android.py --verbose

      - name: Type-check :app against android.jar + run app suite
        run: ./tools/local_android_check.sh

  # ---------------------------------------------------------------------------
  # Job 2: the real Android build, with the actual SDK, aapt2 and d8.
  # ---------------------------------------------------------------------------
  android:
    name: Android build (assembleDebug + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: offline
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Core unit tests (Gradle)
        run: ./gradlew :core:test --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/**
            app/build/reports/**
          if-no-files-found: ignore
